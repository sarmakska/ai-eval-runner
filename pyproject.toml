[project]
name = "ai-eval-runner"
version = "1.0.0"
description = "Evals as code. Datasets, scorers, traces, regressions, all in one CLI."
authors = [{ name = "Sarma Linux", email = "helpme@sarmalinux.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.9",
  "httpx>=0.27",
  "duckdb>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "rich>=13",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]

[project.scripts]
aieval = "aieval.cli:app"

[project.urls]
Homepage = "https://github.com/sarmakska/ai-eval-runner"
Documentation = "https://github.com/sarmakska/ai-eval-runner/wiki"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
